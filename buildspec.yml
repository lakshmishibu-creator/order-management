
version: 0.2

phases:
  install:
    commands:
      - echo "Checking Go version..."
      - go version

  pre_build:
    commands:
      - echo "Preparing application build..."

  build:
    commands:
      - echo "Building Order Management application..."
      - mkdir -p bin
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/application main.go

  post_build:
    commands:
      - echo "Application build completed successfully."

artifacts:
  files:
    - bin/application
    - Procfile
    - .env.example
  discard-paths: no

